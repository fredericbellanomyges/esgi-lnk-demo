# PostgreSQL local pour le développement : docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: esgilnk
      POSTGRES_PASSWORD: esgilnk
      POSTGRES_DB: esgilnk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esgilnk"]
      interval: 2s
      timeout: 3s
      retries: 15
